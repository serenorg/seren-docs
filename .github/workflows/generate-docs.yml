name: Generate Documentation

on:
  repository_dispatch:
    types: [openapi-updated, mcp-updated]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'templates/**'
      - 'manual/**'
      - 'static/**'

permissions:
  contents: read
  deployments: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create dist directory
        run: mkdir -p dist/mcp dist/guides

      - name: Generate Scalar API docs
        run: npm run build:api
        env:
          GH_PAT: ${{ secrets.SERENCORE_PAT }}

      - name: Generate llms.txt files
        run: npm run build:llms

      - name: Generate MCP documentation
        run: npm run build:mcp

      - name: Build manual guides
        run: node scripts/build-guides.js

      - name: Fetch install scripts from seren-local
        run: |
          curl -fsSL "https://raw.githubusercontent.com/serenorg/seren-local/main/scripts/install.sh" -o dist/install.sh
          curl -fsSL "https://raw.githubusercontent.com/serenorg/seren-local/main/scripts/install.ps1" -o dist/install.ps1
          echo "Fetched install scripts from seren-local"

      - name: Copy static files and create headers
        run: |
          # Copy static files (won't overwrite install scripts fetched above)
          if [ -d "static" ]; then
            cp -rn static/* dist/ 2>/dev/null || cp -r --no-clobber static/* dist/ 2>/dev/null || true
            echo "Copied static files to dist/"
          fi

          # Create _headers for Cloudflare Pages
          cat > dist/_headers << 'EOF'
          /llms.txt
            Access-Control-Allow-Origin: *
            Content-Type: text/plain; charset=utf-8
          /llms-full.txt
            Access-Control-Allow-Origin: *
            Content-Type: text/plain; charset=utf-8
          /install.sh
            Access-Control-Allow-Origin: *
            Content-Type: text/plain; charset=utf-8
          /install.ps1
            Access-Control-Allow-Origin: *
            Content-Type: text/plain; charset=utf-8
          /*
            Cache-Control: public, max-age=3600
          EOF
          echo "Created _headers"
          ls -la dist/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=seren-docs

      - name: Trigger seren_website rebuild
        if: success()
        run: |
          if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
            echo "Triggered seren_website rebuild"
          else
            echo "VERCEL_DEPLOY_HOOK not configured, skipping"
          fi
