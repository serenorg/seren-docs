name: Sync Install Scripts to Website

on:
  push:
    branches: [main]
    paths:
      - 'static/install.sh'
      - 'static/install.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger website update
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.WEBSITE_DISPATCH_PAT }}" \
            https://api.github.com/repos/serenorg/seren_website/dispatches \
            -d '{"event_type":"install-scripts-updated","client_payload":{"source":"seren-docs"}}'
          echo "Dispatched install-scripts-updated event to seren_website"
